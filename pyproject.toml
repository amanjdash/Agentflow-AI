[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "1.0.0"
description = "Autonomous Multi-Tool AI Agent with ReAct reasoning, sandboxed execution, and defense-in-depth security"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgentFlow Team" }
]
dependencies = [
    "llama-index-core>=0.11.0",
    "llama-index-llms-gemini>=0.4.0",
    "google-genai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "duckduckgo-search>=7.0.0",
    "sqlparse>=0.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
